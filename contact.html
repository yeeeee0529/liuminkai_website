<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>聯絡我 / liuminkai</title>
    <link rel="icon" href="icon.jpeg">
    <style>
        :root {
            --bg: #000000;
            --panel: #000000;
            --text: #e6e8ee;
            --muted: #b9bec8;
            --dim: #77818f;
            --line: #26313f;
            --accent: #22a7df;
            --accent-2: #8bd5ff;
            --error: #ff6b6b;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            min-height: 100%;
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: "SFMono-Regular", "Cascadia Code", "Fira Code", "Courier New", monospace;
        }

        body {
            display: grid;
            place-items: stretch;
            padding: clamp(18px, 3vw, 36px);
        }

        .terminal {
            width: 100%;
            min-height: calc(100vh - clamp(36px, 6vw, 72px));
            background: var(--panel);
            overflow: hidden;
        }

        .terminal-body {
            min-height: calc(100vh - clamp(36px, 6vw, 72px));
            padding: 0;
            font-size: clamp(1rem, 1.15vw, 1.38rem);
        }

        .output {
            min-height: 0;
            overflow: auto;
            padding-bottom: 4px;
            scroll-behavior: smooth;
        }

        .line {
            margin: 0 0 8px;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
            line-height: 1.35;
        }

        .profile-title {
            margin-bottom: 8px;
            font-size: 1.35em;
            line-height: 1.15;
            color: var(--text);
        }

        .command-line {
            color: var(--text);
        }

        .prompt {
            color: var(--accent);
        }

        .prompt-path {
            display: inline-block;
            min-width: 32px;
            padding: 0 10px;
            color: var(--accent);
            background: rgba(0, 0, 0, 0.12);
        }

        .muted {
            color: var(--muted);
        }

        .dim {
            color: var(--dim);
        }

        .key {
            color: var(--accent-2);
        }

        .error {
            color: var(--error);
        }

        .contact-link {
            color: var(--accent-2);
            text-decoration: none;
            border-bottom: 1px solid var(--line);
        }

        .contact-link:hover {
            border-bottom-color: var(--accent-2);
        }

        .contact-copy {
            color: var(--accent-2);
            background: none;
            border: 0;
            border-bottom: 1px solid var(--line);
            padding: 0;
            font: inherit;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        .contact-copy:hover {
            border-bottom-color: var(--accent-2);
        }

        .back-link {
            color: var(--dim);
            text-decoration: none;
        }

        .back-link:hover {
            color: var(--accent-2);
        }

        .input-form {
            position: relative;
            display: flex;
            align-items: center;
            gap: 8px;
            width: 100%;
            margin-top: 2px;
        }

        .terminal-input {
            position: absolute;
            inset: 0;
            width: 100%;
            border: 0;
            outline: 0;
            padding: 0;
            background: transparent;
            color: var(--text);
            caret-color: var(--accent);
            font: inherit;
        }

        .input-shell {
            position: relative;
            flex: 1;
            min-width: 0;
            min-height: 1.35em;
        }

        .suggestion-line {
            position: absolute;
            inset: 0;
            pointer-events: none;
            white-space: pre;
            color: var(--dim);
        }

        .suggestion {
            display: inline-block;
            color: inherit;
        }

        .suggestion-bar {
            display: none;
            position: absolute;
            left: 0;
            right: 0;
            top: 100%;
            margin-top: 10px;
            padding-bottom: 2px;
            gap: 8px;
            background: var(--panel);
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        .suggestion-bar[hidden] {
            display: none;
        }

        .chip {
            flex: 0 0 auto;
            min-height: 40px;
            padding: 6px 14px;
            border: 1px solid var(--line);
            border-radius: 6px;
            background: rgba(34, 167, 223, 0.08);
            color: var(--muted);
            font: inherit;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        .chip:active {
            border-color: var(--accent);
            color: var(--accent-2);
        }

        @media (hover: hover) and (pointer: fine) {
            .chip:hover {
                border-color: var(--accent);
                color: var(--accent-2);
            }
        }

        .prompt-row {
            display: flex;
            align-items: center;
            gap: 16px;
            width: 100%;
        }

        @media (max-width: 640px) {
            body {
                padding: 10px;
            }

            .terminal {
                min-height: calc(100vh - 20px);
            }

            .terminal-body {
                min-height: calc(100vh - 20px);
                font-size: 1rem;
            }
        }

        @media (pointer: coarse) {
            .suggestion-bar:not([hidden]) {
                display: flex;
            }

            .suggestion-line {
                pointer-events: auto;
            }

            .suggestion:active {
                color: var(--accent-2);
            }
        }
    </style>
</head>
<body>
    <main class="terminal" aria-label="liuminkai contact terminal">
        <section class="terminal-body" onclick="document.getElementById('terminal-input').focus()">
            <div class="output" id="output" aria-live="polite"></div>

            <form class="input-form" id="terminal-form" autocomplete="off">
                <div class="suggestion-bar" id="suggestion-bar" hidden aria-label="command suggestions"></div>
                <div class="prompt-row">
                    <span class="prompt-path">~</span>
                    <span class="input-shell">
                        <span class="suggestion-line" id="suggestion" aria-hidden="true"></span>
                        <input
                            class="terminal-input"
                            id="terminal-input"
                            name="command"
                            type="text"
                            spellcheck="false"
                            autocapitalize="off"
                            autocomplete="off"
                            autofocus
                        >
                    </span>
                </div>
            </form>
        </section>
    </main>

    <script>
        const output = document.getElementById("output");
        const form = document.getElementById("terminal-form");
        const input = document.getElementById("terminal-input");
        const suggestion = document.getElementById("suggestion");
        const suggestionBar = document.getElementById("suggestion-bar");

        const contacts = {
            signal: { label: "@yeeeee0529.24", url: "https://signal.me/#eu/ii61W7G-5GtEW_AqeUflieftaqG0pBRb9f7Dx_4PFo8wj1XiwJpOt4EuyGRO5o0_", external: true },
            telegram: { label: "@yeeeee0529", url: "https://t.me/yeeeee0529", external: true },
            discord: { label: "@yeee_0529", url: null, external: false },
            email: { label: "liuminkai@yeeeee.me", url: "mailto:liuminkai@yeeeee.me", external: false }
        };

        const commandHelp = [
            ["help", "show commands"],
            ["signal", "open Signal"],
            ["telegram", "open Telegram"],
            ["discord", "copy Discord ID"],
            ["email", "email address"],
            ["clear", "clear terminal"]
        ];

        const completions = commandHelp.map(([command]) => command);

        const history = [];
        let historyIndex = 0;
        let activeSuggestion = "";

        function writeLine(content = "", className = "") {
            const line = document.createElement("p");
            line.className = `line ${className}`.trim();
            line.innerHTML = content;
            output.appendChild(line);
            output.scrollTop = output.scrollHeight;
        }

        function writeCommand(command) {
            writeLine(`<span class="prompt-path">~</span> ${escapeHtml(command)}`, "command-line");
        }

        function escapeHtml(value) {
            return value
                .replaceAll("&", "&amp;")
                .replaceAll("<", "&lt;")
                .replaceAll(">", "&gt;")
                .replaceAll("\"", "&quot;")
                .replaceAll("'", "&#039;");
        }

        function writeContact(name) {
            const contact = contacts[name];
            const line = document.createElement("p");
            line.className = "line";

            const key = document.createElement("span");
            key.className = "key";
            key.textContent = name.padEnd(9, " ");
            line.appendChild(key);

            if (name === "discord") {
                const copy = document.createElement("button");
                copy.type = "button";
                copy.className = "contact-copy";
                copy.textContent = contact.label;
                copy.addEventListener("click", () => copyDiscordId());
                line.appendChild(copy);
            } else {
                const link = document.createElement("a");
                link.className = "contact-link";
                link.href = contact.url;
                link.textContent = contact.label;
                if (contact.external) {
                    link.target = "_blank";
                    link.rel = "noopener noreferrer";
                }
                line.appendChild(link);
            }

            output.appendChild(line);
            output.scrollTop = output.scrollHeight;
        }

        function copyDiscordId() {
            const id = contacts.discord.label;
            navigator.clipboard.writeText(id).catch(() => {
                const helper = document.createElement("textarea");
                helper.value = id;
                helper.style.position = "fixed";
                helper.style.opacity = "0";
                document.body.appendChild(helper);
                helper.select();
                document.execCommand("copy");
                helper.remove();
            });
            writeLine(`copied ${id} to clipboard`, "muted");
        }

        function showHelp() {
            writeLine("Available commands:", "muted");
            commandHelp.forEach(([command, description]) => {
                writeLine(`  ${command.padEnd(12, " ")} ${description}`, "muted");
            });
        }

        function resetTerminal() {
            output.innerHTML = "";
            showContacts();
        }

        function showContacts() {
            writeLine("liuminkai — contact", "profile-title");
            writeLine("Taipei / yeeeee.me");
            writeLine("");
            Object.keys(contacts).forEach((name) => writeContact(name));
            writeLine("");
            writeLine("click a contact or type a command", "dim");
            writeLine("type `help` to see commands", "dim");
            writeLine("");
            writeLine('<a class="back-link" href="liuminkai.html">← back to profile</a>');
        }

        function openContact(name) {
            const contact = contacts[name];
            if (!contact) {
                writeLine(`open: ${escapeHtml(name || "")}: unknown target`, "error");
                return;
            }

            if (name === "discord") {
                copyDiscordId();
                return;
            }

            writeLine(`opening ${escapeHtml(name)}...`, "muted");
            window.open(contact.url, contact.external ? "_blank" : "_self", "noopener,noreferrer");
        }

        function runCommand(rawCommand) {
            const command = rawCommand.trim();
            if (!command) {
                return;
            }

            history.push(command);
            historyIndex = history.length;
            writeCommand(command);

            const program = command.toLowerCase();

            switch (program) {
                case "help":
                    showHelp();
                    break;
                case "signal":
                case "telegram":
                case "discord":
                    openContact(program);
                    break;
                case "email":
                    writeLine(contacts.email.label, "key");
                    break;
                case "clear":
                    resetTerminal();
                    break;
                default:
                    writeLine(`${escapeHtml(program)}: command not found`, "error");
                    writeLine("type `help` to see available commands", "dim");
                    break;
            }
        }

        form.addEventListener("submit", (event) => {
            event.preventDefault();
            runCommand(input.value);
            input.value = "";
            updateSuggestion();
        });

        input.addEventListener("keydown", (event) => {
            if (event.key === "Tab") {
                event.preventDefault();
                acceptSuggestion();
                return;
            }

            if (event.key === "ArrowRight" && activeSuggestion) {
                event.preventDefault();
                acceptSuggestion();
                return;
            }

            if (event.key === "ArrowUp") {
                event.preventDefault();
                historyIndex = Math.max(0, historyIndex - 1);
                input.value = history[historyIndex] || "";
                updateSuggestion();
            }

            if (event.key === "ArrowDown") {
                event.preventDefault();
                historyIndex = Math.min(history.length, historyIndex + 1);
                input.value = history[historyIndex] || "";
                updateSuggestion();
            }
        });

        input.addEventListener("input", updateSuggestion);

        suggestion.addEventListener("click", () => {
            acceptSuggestion();
            input.focus();
        });

        function getCandidates(value) {
            const normalized = value.toLowerCase();
            if (!normalized) {
                return [];
            }

            return completions.filter((command) => command.startsWith(normalized) && command !== normalized);
        }

        function renderChips(candidates) {
            suggestionBar.innerHTML = "";

            candidates.forEach((command) => {
                const chip = document.createElement("button");
                chip.type = "button";
                chip.className = "chip";
                chip.textContent = command;
                chip.addEventListener("click", () => {
                    input.value = command;
                    updateSuggestion();
                    input.focus();
                });
                suggestionBar.appendChild(chip);
            });

            suggestionBar.hidden = candidates.length === 0;
        }

        function updateSuggestion() {
            const current = input.value;
            const candidates = getCandidates(current);
            const match = candidates[0] || "";

            activeSuggestion = match ? match.slice(current.length) : "";
            suggestion.textContent = activeSuggestion;
            suggestion.style.transform = `translateX(${measureInputText(current)}px)`;
            renderChips(candidates);
        }

        function measureInputText(value) {
            const canvas = measureInputText.canvas || (measureInputText.canvas = document.createElement("canvas"));
            const context = canvas.getContext("2d");
            context.font = getComputedStyle(input).font;
            return context.measureText(value).width;
        }

        function acceptSuggestion() {
            if (!activeSuggestion) {
                return;
            }

            input.value += activeSuggestion;
            updateSuggestion();
        }

        showContacts();
        updateSuggestion();
        input.focus();
    </script>
</body>
</html>
