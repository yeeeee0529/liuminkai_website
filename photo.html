<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>攝影 / liuminkai</title>
    <link rel="icon" href="icon.jpeg">
    <style>
        :root {
            --bg: #000000;
            --panel: #000000;
            --text: #e6e8ee;
            --muted: #b9bec8;
            --dim: #77818f;
            --line: #26313f;
            --accent: #22a7df;
            --accent-2: #8bd5ff;
            --error: #ff6b6b;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            min-height: 100%;
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: "SFMono-Regular", "Cascadia Code", "Fira Code", "Courier New", monospace;
        }

        body {
            display: grid;
            place-items: stretch;
            padding: clamp(18px, 3vw, 36px);
        }

        .terminal {
            width: 100%;
            min-height: calc(100vh - clamp(36px, 6vw, 72px));
            background: var(--panel);
            overflow: hidden;
        }

        .terminal-body {
            min-height: calc(100vh - clamp(36px, 6vw, 72px));
            padding: 0;
            font-size: clamp(1rem, 1.15vw, 1.38rem);
        }

        .output {
            min-height: 0;
            overflow: auto;
            padding-bottom: 4px;
            scroll-behavior: smooth;
        }

        .line {
            margin: 0 0 8px;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
            line-height: 1.35;
        }

        .profile-title {
            margin-bottom: 8px;
            font-size: 1.35em;
            line-height: 1.15;
            color: var(--text);
        }

        .command-line {
            color: var(--text);
        }

        .prompt {
            color: var(--accent);
        }

        .prompt-path {
            display: inline-block;
            min-width: 32px;
            padding: 0 10px;
            color: var(--accent);
            background: rgba(0, 0, 0, 0.12);
        }

        .muted {
            color: var(--muted);
        }

        .dim {
            color: var(--dim);
        }

        .key {
            color: var(--accent-2);
        }

        .error {
            color: var(--error);
        }

        .work-link {
            color: var(--accent-2);
            background: none;
            border: 0;
            border-bottom: 1px solid var(--line);
            padding: 0;
            font: inherit;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        .work-link:hover {
            border-bottom-color: var(--accent-2);
        }

        .photo-link {
            display: inline-block;
            max-width: 100%;
        }

        .photo-img {
            display: block;
            max-width: 100%;
            height: auto;
            margin: 4px 0 12px;
            border: 1px solid var(--line);
            cursor: pointer;
        }

        .back-link {
            color: var(--dim);
            text-decoration: none;
        }

        .back-link:hover {
            color: var(--accent-2);
        }

        .input-form {
            position: relative;
            display: flex;
            align-items: center;
            gap: 8px;
            width: 100%;
            margin-top: 2px;
        }

        .terminal-input {
            position: absolute;
            inset: 0;
            width: 100%;
            border: 0;
            outline: 0;
            padding: 0;
            background: transparent;
            color: var(--text);
            caret-color: var(--accent);
            font: inherit;
        }

        .input-shell {
            position: relative;
            flex: 1;
            min-width: 0;
            min-height: 1.35em;
        }

        .suggestion-line {
            position: absolute;
            inset: 0;
            pointer-events: none;
            white-space: pre;
            color: var(--dim);
        }

        .suggestion {
            display: inline-block;
            color: inherit;
        }

        .suggestion-bar {
            display: none;
            position: absolute;
            left: 0;
            right: 0;
            top: 100%;
            margin-top: 10px;
            padding-bottom: 2px;
            gap: 8px;
            background: var(--panel);
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        .suggestion-bar[hidden] {
            display: none;
        }

        .chip {
            flex: 0 0 auto;
            min-height: 40px;
            padding: 6px 14px;
            border: 1px solid var(--line);
            border-radius: 6px;
            background: rgba(34, 167, 223, 0.08);
            color: var(--muted);
            font: inherit;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        .chip:active {
            border-color: var(--accent);
            color: var(--accent-2);
        }

        @media (hover: hover) and (pointer: fine) {
            .chip:hover {
                border-color: var(--accent);
                color: var(--accent-2);
            }
        }

        .prompt-row {
            display: flex;
            align-items: center;
            gap: 16px;
            width: 100%;
        }

        @media (max-width: 640px) {
            body {
                padding: 10px;
            }

            .terminal {
                min-height: calc(100vh - 20px);
            }

            .terminal-body {
                min-height: calc(100vh - 20px);
                font-size: 1rem;
            }
        }

        @media (pointer: coarse) {
            .suggestion-bar:not([hidden]) {
                display: flex;
            }

            .suggestion-line {
                pointer-events: auto;
            }

            .suggestion:active {
                color: var(--accent-2);
            }
        }
    </style>
</head>
<body>
    <main class="terminal" aria-label="liuminkai photography terminal">
        <section class="terminal-body" onclick="document.getElementById('terminal-input').focus()">
            <div class="output" id="output" aria-live="polite"></div>

            <form class="input-form" id="terminal-form" autocomplete="off">
                <div class="suggestion-bar" id="suggestion-bar" hidden aria-label="command suggestions"></div>
                <div class="prompt-row">
                    <span class="prompt-path">~/photo</span>
                    <span class="input-shell">
                        <span class="suggestion-line" id="suggestion" aria-hidden="true"></span>
                        <input
                            class="terminal-input"
                            id="terminal-input"
                            name="command"
                            type="text"
                            spellcheck="false"
                            autocapitalize="off"
                            autocomplete="off"
                            autofocus
                        >
                    </span>
                </div>
            </form>
        </section>
    </main>

    <script src="photo/manifest.js"></script>
    <script>
        const output = document.getElementById("output");
        const form = document.getElementById("terminal-form");
        const input = document.getElementById("terminal-input");
        const suggestion = document.getElementById("suggestion");
        const suggestionBar = document.getElementById("suggestion-bar");

        const works = window.PHOTO_WORKS || [];
        const manifestMissing = !window.PHOTO_WORKS;

        const commandHelp = [
            ["help", "show commands"],
            ["list", "list all works"],
            ["show <work>", "show a work"],
            ["next", "next work"],
            ["prev", "previous work"],
            ["random", "random work"],
            ["back", "back to profile"],
            ["clear", "clear terminal"]
        ];

        const completions = commandHelp
            .map(([command]) => command)
            .concat(works.map((work) => `show ${work.slug}`));

        const history = [];
        let historyIndex = 0;
        let activeSuggestion = "";
        let currentIndex = -1;

        function writeLine(content = "", className = "") {
            const line = document.createElement("p");
            line.className = `line ${className}`.trim();
            line.innerHTML = content;
            output.appendChild(line);
            output.scrollTop = output.scrollHeight;
        }

        function writeCommand(command) {
            writeLine(`<span class="prompt-path">~/photo</span> ${escapeHtml(command)}`, "command-line");
        }

        function escapeHtml(value) {
            return value
                .replaceAll("&", "&amp;")
                .replaceAll("<", "&lt;")
                .replaceAll(">", "&gt;")
                .replaceAll("\"", "&quot;")
                .replaceAll("'", "&#039;");
        }

        function showHelp() {
            writeLine("Available commands:", "muted");
            commandHelp.forEach(([command, description]) => {
                writeLine(`  ${command.padEnd(12, " ")} ${description}`, "muted");
            });
        }

        function writeWorkRow(work) {
            const line = document.createElement("p");
            line.className = "line";

            const button = document.createElement("button");
            button.type = "button";
            button.className = "work-link";
            button.textContent = work.slug;
            button.addEventListener("click", () => showWork(work));
            line.appendChild(button);

            const count = document.createElement("span");
            count.className = "dim";
            count.textContent = `  ${work.images.length} photo(s)`;
            line.appendChild(count);

            output.appendChild(line);
            output.scrollTop = output.scrollHeight;
        }

        function writeImage(src) {
            const line = document.createElement("p");
            line.className = "line";

            const link = document.createElement("a");
            link.className = "photo-link";
            link.href = src;
            link.target = "_blank";
            link.rel = "noopener noreferrer";

            const image = document.createElement("img");
            image.className = "photo-img";
            image.src = src;
            image.loading = "lazy";
            image.alt = src;
            image.addEventListener("error", () => {
                line.innerHTML = "";
                const fail = document.createElement("span");
                fail.className = "error";
                fail.textContent = `error loading ${src}`;
                line.appendChild(fail);
            });

            link.appendChild(image);
            line.appendChild(link);
            output.appendChild(line);
            output.scrollTop = output.scrollHeight;
        }

        function showWork(work) {
            currentIndex = works.indexOf(work);
            writeLine(`<span class="key">${escapeHtml(work.slug)}</span>`);

            if (work.images.length === 0) {
                writeLine("no images found in this work", "dim");
            }
            work.images.forEach((src) => writeImage(src));

            if (work.caption) {
                writeLine(escapeHtml(work.caption), "muted");
            }
        }

        function showWorkList() {
            if (manifestMissing) {
                writeLine("photo manifest not found", "error");
                writeLine("run `node scripts/build-photo-manifest.js` and reload", "dim");
                return;
            }

            if (works.length === 0) {
                writeLine("no works yet", "dim");
                writeLine("add a folder under photo/ with images and a .txt note", "dim");
                return;
            }

            works.forEach((work) => writeWorkRow(work));
        }

        function showWorkByName(name) {
            if (!name) {
                writeLine("usage: show <work>", "error");
                return;
            }

            const work = works.find((candidate) => candidate.slug.toLowerCase() === name.toLowerCase());
            if (!work) {
                writeLine(`show: ${escapeHtml(name)}: no such work`, "error");
                writeLine("type `list` to see all works", "dim");
                return;
            }

            showWork(work);
        }

        function step(direction) {
            if (works.length === 0) {
                writeLine("no works to browse", "error");
                return;
            }

            if (currentIndex === -1) {
                writeLine("type `show <work>` first", "dim");
                return;
            }

            const nextIndex = (currentIndex + direction + works.length) % works.length;
            showWork(works[nextIndex]);
        }

        function showRandomWork() {
            if (works.length === 0) {
                writeLine("no works to show", "error");
                return;
            }

            showWork(works[Math.floor(Math.random() * works.length)]);
        }

        function showIntro() {
            writeLine("liuminkai — photography", "profile-title");
            writeLine("Taipei / yeeeee.me");
            writeLine("");
            showWorkList();
            writeLine("");
            writeLine("type `show <work>` to view a work", "dim");
            writeLine("type `help` to see commands", "dim");
            writeLine("");
            writeLine('<a class="back-link" href="liuminkai.html">← back to profile</a>');
        }

        function resetTerminal() {
            output.innerHTML = "";
            currentIndex = -1;
            showIntro();
        }

        function runCommand(rawCommand) {
            const command = rawCommand.trim();
            if (!command) {
                return;
            }

            history.push(command);
            historyIndex = history.length;
            writeCommand(command);

            const [program, ...args] = command.toLowerCase().split(/\s+/);
            const target = args.join(" ");

            switch (program) {
                case "help":
                    showHelp();
                    break;
                case "list":
                case "ls":
                    showWorkList();
                    break;
                case "show":
                    showWorkByName(target);
                    break;
                case "next":
                    step(1);
                    break;
                case "prev":
                    step(-1);
                    break;
                case "random":
                    showRandomWork();
                    break;
                case "back":
                    writeLine("opening profile...", "muted");
                    window.open("liuminkai.html", "_self", "noopener,noreferrer");
                    break;
                case "clear":
                    resetTerminal();
                    break;
                default:
                    writeLine(`${escapeHtml(program)}: command not found`, "error");
                    writeLine("type `help` to see available commands", "dim");
                    break;
            }
        }

        form.addEventListener("submit", (event) => {
            event.preventDefault();
            runCommand(input.value);
            input.value = "";
            updateSuggestion();
        });

        input.addEventListener("keydown", (event) => {
            if (event.key === "Tab") {
                event.preventDefault();
                acceptSuggestion();
                return;
            }

            if (event.key === "ArrowRight" && activeSuggestion) {
                event.preventDefault();
                acceptSuggestion();
                return;
            }

            if (event.key === "ArrowUp") {
                event.preventDefault();
                historyIndex = Math.max(0, historyIndex - 1);
                input.value = history[historyIndex] || "";
                updateSuggestion();
            }

            if (event.key === "ArrowDown") {
                event.preventDefault();
                historyIndex = Math.min(history.length, historyIndex + 1);
                input.value = history[historyIndex] || "";
                updateSuggestion();
            }
        });

        input.addEventListener("input", updateSuggestion);

        suggestion.addEventListener("click", () => {
            acceptSuggestion();
            input.focus();
        });

        function getCandidates(value) {
            const normalized = value.toLowerCase();
            if (!normalized) {
                return [];
            }

            return completions.filter((command) => command.startsWith(normalized) && command !== normalized);
        }

        function renderChips(candidates) {
            suggestionBar.innerHTML = "";

            candidates.forEach((command) => {
                const chip = document.createElement("button");
                chip.type = "button";
                chip.className = "chip";
                chip.textContent = command;
                chip.addEventListener("click", () => {
                    input.value = command;
                    updateSuggestion();
                    input.focus();
                });
                suggestionBar.appendChild(chip);
            });

            suggestionBar.hidden = candidates.length === 0;
        }

        function updateSuggestion() {
            const current = input.value;
            const candidates = getCandidates(current);
            const match = candidates[0] || "";

            activeSuggestion = match ? match.slice(current.length) : "";
            suggestion.textContent = activeSuggestion;
            suggestion.style.transform = `translateX(${measureInputText(current)}px)`;
            renderChips(candidates);
        }

        function measureInputText(value) {
            const canvas = measureInputText.canvas || (measureInputText.canvas = document.createElement("canvas"));
            const context = canvas.getContext("2d");
            context.font = getComputedStyle(input).font;
            return context.measureText(value).width;
        }

        function acceptSuggestion() {
            if (!activeSuggestion) {
                return;
            }

            input.value += activeSuggestion;
            updateSuggestion();
        }

        showIntro();
        updateSuggestion();
        input.focus();
    </script>
</body>
</html>
