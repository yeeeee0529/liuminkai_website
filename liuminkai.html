<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>liuminkai</title>
    <link rel="icon" href="icon.jpeg">
    <style>
        :root {
            --bg: #000000;
            --panel: #000000;
            --text: #e6e8ee;
            --muted: #b9bec8;
            --dim: #77818f;
            --line: #26313f;
            --accent: #22a7df;
            --accent-2: #8bd5ff;
            --error: #ff6b6b;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            min-height: 100%;
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: "SFMono-Regular", "Cascadia Code", "Fira Code", "Courier New", monospace;
        }

        body {
            display: grid;
            place-items: stretch;
            padding: clamp(18px, 3vw, 36px);
        }

        .terminal {
            width: 100%;
            min-height: calc(100vh - clamp(36px, 6vw, 72px));
            background: var(--panel);
            overflow: hidden;
        }

        .terminal-body {
            min-height: calc(100vh - clamp(36px, 6vw, 72px));
            padding: 0;
            font-size: clamp(1rem, 1.15vw, 1.38rem);
        }

        .output {
            min-height: 0;
            overflow: auto;
            padding-bottom: 4px;
            scroll-behavior: smooth;
        }

        .line {
            margin: 0 0 8px;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
            line-height: 1.35;
        }

        .profile-title {
            margin-bottom: 8px;
            font-size: 1.35em;
            line-height: 1.15;
            color: var(--text);
        }

        .command-line {
            color: var(--text);
        }

        .prompt {
            color: var(--accent);
        }

        .prompt-path {
            display: inline-block;
            min-width: 32px;
            padding: 0 10px;
            color: var(--accent);
            background: rgba(0, 0, 0, 0.12);
        }

        .muted {
            color: var(--muted);
        }

        .dim {
            color: var(--dim);
        }

        .key {
            color: var(--accent-2);
        }

        .error {
            color: var(--error);
        }

        .input-form {
            position: relative;
            display: flex;
            align-items: center;
            gap: 8px;
            width: 100%;
            margin-top: 2px;
        }

        .terminal-input {
            position: absolute;
            inset: 0;
            width: 100%;
            border: 0;
            outline: 0;
            padding: 0;
            background: transparent;
            color: var(--text);
            caret-color: var(--accent);
            font: inherit;
        }

        .input-shell {
            position: relative;
            flex: 1;
            min-width: 0;
            min-height: 1.35em;
        }

        .suggestion-line {
            position: absolute;
            inset: 0;
            pointer-events: none;
            white-space: pre;
            color: var(--dim);
        }

        .suggestion {
            display: inline-block;
            color: inherit;
        }

        .suggestion-bar {
            display: none;
            position: absolute;
            left: 0;
            right: 0;
            top: 100%;
            margin-top: 10px;
            padding-bottom: 2px;
            gap: 8px;
            background: var(--panel);
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        .suggestion-bar[hidden] {
            display: none;
        }

        .chip {
            flex: 0 0 auto;
            min-height: 40px;
            padding: 6px 14px;
            border: 1px solid var(--line);
            border-radius: 6px;
            background: rgba(34, 167, 223, 0.08);
            color: var(--muted);
            font: inherit;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        .chip:active {
            border-color: var(--accent);
            color: var(--accent-2);
        }

        @media (hover: hover) and (pointer: fine) {
            .chip:hover {
                border-color: var(--accent);
                color: var(--accent-2);
            }
        }

        .prompt-row {
            display: flex;
            align-items: center;
            gap: 16px;
            width: 100%;
        }

        @media (max-width: 640px) {
            body {
                padding: 10px;
            }

            .terminal {
                min-height: calc(100vh - 20px);
            }

            .terminal-body {
                min-height: calc(100vh - 20px);
                font-size: 1rem;
            }
        }

        @media (pointer: coarse) {
            .suggestion-bar:not([hidden]) {
                display: flex;
            }

            .suggestion-line {
                pointer-events: auto;
            }

            .suggestion:active {
                color: var(--accent-2);
            }
        }
    </style>
</head>
<body>
    <main class="terminal" aria-label="liuminkai interactive terminal">
        <section class="terminal-body" onclick="document.getElementById('terminal-input').focus()">
            <div class="output" id="output" aria-live="polite"></div>

            <form class="input-form" id="terminal-form" autocomplete="off">
                <div class="suggestion-bar" id="suggestion-bar" hidden aria-label="command suggestions"></div>
                <div class="prompt-row">
                    <span class="prompt-path">~</span>
                    <span class="input-shell">
                        <span class="suggestion-line" id="suggestion" aria-hidden="true"></span>
                        <input
                            class="terminal-input"
                            id="terminal-input"
                            name="command"
                            type="text"
                            spellcheck="false"
                            autocapitalize="off"
                            autocomplete="off"
                            autofocus
                        >
                    </span>
                </div>
            </form>
        </section>
    </main>

    <script>
        const output = document.getElementById("output");
        const form = document.getElementById("terminal-form");
        const input = document.getElementById("terminal-input");
        const suggestion = document.getElementById("suggestion");
        const suggestionBar = document.getElementById("suggestion-bar");

        const links = {
            instagram: "https://www.instagram.com/yeee_0529/",
            x: "https://x.com/yeeeee0529",
            twitter: "https://x.com/yeeeee0529",
            facebook: "https://www.facebook.com/profile.php?id=100024583774052",
            github: "https://github.com/yeeeee0529",
            email: "mailto:liuminkai@yeeeee.me"
        };

        const files = {
            about: [
                "<span class=\"key\">name</span>: liuminkai",
                "<span class=\"key\">site</span>: yeeeee.me",
                "<span class=\"key\">mail</span>: liuminkai@yeeeee.me"
            ],
            links: [
                "instagram",
                "x",
                "facebook",
                "github",
                "email"
            ]
        };

        const commandHelp = [
            ["help", "show commands"],
            ["whoami", "print profile name"],
            ["pwd", "print current path"],
            ["cat about", "show basic info"],
            ["cat links", "show link names"],
            ["instagram", "open Instagram"],
            ["x", "open X"],
            ["facebook", "open Facebook"],
            ["github", "open GitHub"],
            ["email", "email address"],
            ["clear", "clear terminal"]
        ];

        const completions = commandHelp.map(([command]) => command);

        const history = [];
        let historyIndex = 0;
        let activeSuggestion = "";

        function writeLine(content = "", className = "") {
            const line = document.createElement("p");
            line.className = `line ${className}`.trim();
            line.innerHTML = content;
            output.appendChild(line);
            output.scrollTop = output.scrollHeight;
        }

        function writeCommand(command) {
            writeLine(`<span class="prompt-path">~</span> ${escapeHtml(command)}`, "command-line");
        }

        function escapeHtml(value) {
            return value
                .replaceAll("&", "&amp;")
                .replaceAll("<", "&lt;")
                .replaceAll(">", "&gt;")
                .replaceAll("\"", "&quot;")
                .replaceAll("'", "&#039;");
        }

        function showHelp() {
            writeLine("Available commands:", "muted");
            commandHelp.forEach(([command, description]) => {
                writeLine(`  ${command.padEnd(12, " ")} ${description}`, "muted");
            });
        }

        function getAgeFromBirthday(year, month, day) {
            const today = new Date();
            let age = today.getFullYear() - year;
            const hasHadBirthdayThisYear =
                today.getMonth() + 1 > month ||
                (today.getMonth() + 1 === month && today.getDate() >= day);

            if (!hasHadBirthdayThisYear) {
                age -= 1;
            }

            return age;
        }

        function showProfileIntro() {
            writeLine("liuminkai", "profile-title");
            writeLine(`Taipei / ${getAgeFromBirthday(2009, 5, 29)}y / Programmer / Photographer`);
            writeLine("");
        }

        function resetTerminal() {
            output.innerHTML = "";
            showProfileIntro();
        }

        function runCommand(rawCommand) {
            const command = rawCommand.trim();
            if (!command) {
                return;
            }

            history.push(command);
            historyIndex = history.length;
            writeCommand(command);

            const [program, ...args] = command.toLowerCase().split(/\s+/);
            const target = args.join(" ");

            switch (program) {
                case "help":
                    showHelp();
                    break;
                case "whoami":
                    writeLine("LIUMINKAI");
                    break;
                case "pwd":
                    writeLine("/Users/liuminkai/profile");
                    break;
                case "cat":
                    if (files[target]) {
                        files[target].forEach((line) => writeLine(line));
                    } else {
                        writeLine(`cat: ${escapeHtml(target || "")}: No such file`, "error");
                    }
                    break;
                case "email":
                    writeLine("liuminkai@yeeeee.me");
                    break;
                case "instagram":
                case "x":
                case "twitter":
                case "facebook":
                case "github":
                    openLink(program);
                    break;
                case "clear":
                    resetTerminal();
                    break;
                default:
                    writeLine(`${escapeHtml(program)}: command not found`, "error");
                    writeLine("type `help` to see available commands", "dim");
                    break;
            }
        }

        function openLink(name) {
            const url = links[name];
            if (!url) {
                writeLine(`open: ${escapeHtml(name || "")}: unknown target`, "error");
                return;
            }

            writeLine(`opening ${escapeHtml(name)}...`, "muted");
            window.open(url, name === "email" ? "_self" : "_blank", "noopener,noreferrer");
        }

        form.addEventListener("submit", (event) => {
            event.preventDefault();
            runCommand(input.value);
            input.value = "";
            updateSuggestion();
        });

        input.addEventListener("keydown", (event) => {
            if (event.key === "Tab") {
                event.preventDefault();
                acceptSuggestion();
                return;
            }

            if (event.key === "ArrowRight" && activeSuggestion) {
                event.preventDefault();
                acceptSuggestion();
                return;
            }

            if (event.key === "ArrowUp") {
                event.preventDefault();
                historyIndex = Math.max(0, historyIndex - 1);
                input.value = history[historyIndex] || "";
                updateSuggestion();
            }

            if (event.key === "ArrowDown") {
                event.preventDefault();
                historyIndex = Math.min(history.length, historyIndex + 1);
                input.value = history[historyIndex] || "";
                updateSuggestion();
            }
        });

        input.addEventListener("input", updateSuggestion);

        suggestion.addEventListener("click", () => {
            acceptSuggestion();
            input.focus();
        });

        function getCandidates(value) {
            const normalized = value.toLowerCase();
            if (!normalized) {
                return [];
            }

            return completions.filter((command) => command.startsWith(normalized) && command !== normalized);
        }

        function renderChips(candidates) {
            suggestionBar.innerHTML = "";

            candidates.forEach((command) => {
                const chip = document.createElement("button");
                chip.type = "button";
                chip.className = "chip";
                chip.textContent = command;
                chip.addEventListener("click", () => {
                    input.value = command;
                    updateSuggestion();
                    input.focus();
                });
                suggestionBar.appendChild(chip);
            });

            suggestionBar.hidden = candidates.length === 0;
        }

        function updateSuggestion() {
            const current = input.value;
            const candidates = getCandidates(current);
            const match = candidates[0] || "";

            activeSuggestion = match ? match.slice(current.length) : "";
            suggestion.textContent = activeSuggestion;
            suggestion.style.transform = `translateX(${measureInputText(current)}px)`;
            renderChips(candidates);
        }

        function measureInputText(value) {
            const canvas = measureInputText.canvas || (measureInputText.canvas = document.createElement("canvas"));
            const context = canvas.getContext("2d");
            context.font = getComputedStyle(input).font;
            return context.measureText(value).width;
        }

        function acceptSuggestion() {
            if (!activeSuggestion) {
                return;
            }

            input.value += activeSuggestion;
            updateSuggestion();
        }

        showProfileIntro();
        showHelp();
        updateSuggestion();
        input.focus();
    </script>
</body>
</html>
